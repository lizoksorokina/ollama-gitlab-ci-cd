stages:
  - build
  - test
  - deploy
  - lint

variables:
  DOCKER_IMAGE_TAG: $DOCKER_REGISTRY/$DOCKER_REPOSITORY:ollama-$CI_COMMIT_SHORT_SHA

build:
  stage: build
  image: docker:28
  services:
    - name: docker:28-dind
      alias: docker
  variables:
    DOCKER_HOST: docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo $DOCKER_REGISTRY_PASSWORD | docker login -u $DOCKER_REGISTRY_USER --password-stdin $DOCKER_REGISTRY
  script:
    # - docker build -t $DOCKER_IMAGE_TAG .
    - docker pull ollama/ollama:0.12.8
    - docker tag ollama/ollama:0.12.8 $DOCKER_IMAGE_TAG
    - docker push $DOCKER_IMAGE_TAG


tests:
  stage: test
  image: golang:1.24
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%$/'
  before_script:
    - go mod download
  script:
    - go test -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out

lint:
  stage: test
  image: golang:1.24
  before_script:
    - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.2.2
    - golangci-lint --versio
  script:
    - golangci-lint migrate || true
    - golangci-lint run ./...
